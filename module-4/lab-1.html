<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="lab-1.css">
    <title>Document</title>
</head>
<body>
    <div id="calc">
        <div id="display">
            <div id="num1" class="numDisplay" onclick="numChange(1)"><h1></h1></div>
            <div id="num2" class="numDisplay" onclick="numChange(2)"><h1></h1></div>
        </div>
        
        <div id="buttonsContainer">
            <div id="numButtons">
                <div id="one" class="button" onclick="pushNumber(1)"><h2>1</h2></div>
                <div id="two" class="button" onclick="pushNumber(2)"><h2>2</h2></div>
                <div id="three" class="button" onclick="pushNumber(3)"><h2>3</h2></div>
                <div id="four" class="button" onclick="pushNumber(4)"><h2>4</h2></div>
                <div id="five" class="button" onclick="pushNumber(5)"><h2>5</h2></div>
                <div id="six" class="button" onclick="pushNumber(6)"><h2>6</h2></div>
                <div id="seven" class="button" onclick="pushNumber(7)"><h2>7</h2></div>
                <div id="eight" class="button" onclick="pushNumber(8)"><h2>8</h2></div>
                <div id="nine" class="button" onclick="pushNumber(9)"><h2>9</h2></div>
                <div id="zero" class="button" onclick="pushNumber(0)"><h2>0</h2></div>
            </div>

            <div id="funcButtons">
                <div id="clear" class="button" onclick="clea()"><h2>C</h2></div>
                <div id="plus" class="button" onclick="addNums()"><h2>+</h2></div>
                <div id="minus" class="button" onclick="subNums()"><h2>-</h2></div>
                <div id="divide" class="button" onclick="divNums()"><h2>/</h2></div>
                <div id="multiply" class="button" onclick="multNums()"><h2>*</h2></div>
            </div>
        </div>
    </div>
</body>
<script src="lab-1.js"></script>
</html>
